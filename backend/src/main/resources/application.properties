server.port=8080
server.servlet.context-path=/api

spring.datasource.url=jdbc:h2:mem:minibank;MODE=PostgreSQL;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=

spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.defer-datasource-initialization=true
spring.jpa.show-sql=false

spring.h2.console.enabled=true
spring.h2.console.path=/h2-console

# Pas de requêtes SQL pendant le rendu de la réponse HTTP (bonne pratique, supprime le WARN au démarrage)
spring.jpa.open-in-view=false

# Swagger UI affiche NOTRE contrat (api/openapi.yaml), pas une spec déduite du code
springdoc.swagger-ui.url=/api/openapi.yaml
springdoc.swagger-ui.path=/swagger-ui.html

# Import Camel des fichiers legacy : dossier surveillé (relatif au dossier backend/)
minibank.legacy.inbox=../legacy-data/inbox
# Garde l'application en vie même si Camel est le seul à tourner
camel.main.run-controller=true
